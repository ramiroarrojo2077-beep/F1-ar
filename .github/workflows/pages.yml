name: Publicar en GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # solo publica lo que está en la rama por defecto
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # solo los archivos del juego (no la app Android ni su clave de firma)
      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp -R index.html manifest.webmanifest sw.js .nojekyll css fonts icons js vendor docs _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
